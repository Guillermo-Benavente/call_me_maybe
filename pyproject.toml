[project]
name = "call-me-maybe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy",
    "pydantic",
]

[dependency-groups]
dev = [
    "flake8",
    "mypy",
]

[tool.mypy]
mypy_path = "llm_sdk"
exclude = ["^llm_sdk/", "^\\.venv/"]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }
