[project]
name = "call-me-maybe"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=2.2.6",
    "pydantic>=2.14.0",
]

[dependency-groups]
dev = [
    "flake8>=7.4.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.mypy]
mypy_path = "llm_sdk"
exclude = ["^llm_sdk/", "^\\.venv/"]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }
